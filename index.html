<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Shop Apps · Unusual Machines</title>
<style>
:root{--page:#F6F3FC;--panel:#FFFFFF;--text:#1E1630;--muted:#5E5573;--ink:#3B2670;--on-ink:#fff;--edge:#CFC3EC;--lav:#E9E3F5;--err:#A8261D;
--f:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;--fc:"Barlow Condensed","Barlow",system-ui,Arial,sans-serif}
@media(prefers-color-scheme:dark){:root{--page:#15111D;--panel:#1E1829;--text:#EEE9F8;--muted:#B3A9C9;--ink:#CDBDF5;--on-ink:#15111D;--edge:#3D3359;--lav:#2B2340;--err:#FF8A80}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--page);color:var(--text);font-family:var(--f);line-height:1.4;display:flex;flex-direction:column}
.top{padding:12px 20px;background:var(--panel);border-bottom:3px solid var(--edge);display:flex;align-items:center;gap:16px}
.logo{display:flex}.logo img{height:64px;width:auto;display:block}
@media(prefers-color-scheme:dark){.logo{background:#fff;border-radius:8px;padding:3px 8px}}
.brand{font-family:var(--fc);font-weight:600;font-size:24px;color:var(--ink);line-height:1.1}
.brand small{display:block;font-family:var(--f);font-weight:400;font-size:13px;color:var(--muted)}
main{flex:1;width:100%;max-width:560px;margin:0 auto;padding:28px 16px 48px}
h1{font-family:var(--fc);font-weight:600;font-size:28px;margin:0 0 4px;color:var(--ink)}
p{margin:0 0 20px;color:var(--muted)}
.box{background:var(--panel);border:1px solid var(--edge);border-radius:12px;padding:24px;max-width:340px;margin:8vh auto 0;text-align:center}
.box h1{font-size:26px}
input{width:100%;font-size:24px;text-align:center;letter-spacing:.4em;padding:10px;border:1px solid var(--edge);border-radius:8px;background:var(--page);color:inherit}
button.go{margin-top:12px;width:100%;font-size:17px;padding:12px;border:0;border-radius:8px;background:var(--ink);color:var(--on-ink);font-weight:600;cursor:pointer}
input:focus-visible,button:focus-visible,a.card:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.err{color:var(--err);min-height:1.3em;margin-top:8px;font-size:14px}
a.card{display:flex;justify-content:space-between;align-items:center;padding:16px 18px;margin:0 0 12px;background:var(--panel);border:1px solid var(--edge);border-radius:10px;color:var(--text);text-decoration:none;font-family:var(--fc);font-weight:600;font-size:21px}
a.card small{display:block;font-family:var(--f);font-weight:400;font-size:14px;color:var(--muted)}
a.card span{color:var(--ink);font-size:24px}
a.card:hover{background:var(--lav)}
.lock{background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;font-size:14px;margin-top:12px;font-family:inherit}
[hidden]{display:none!important}
</style></head><body>
<div class="top"><span class="logo"><img src="logo.png" alt="Unusual Machines"></span><div class="brand">Shop Apps<small>Unusual Machines</small></div></div>
<main>
<form id="gate" class="box">
<h1>Shop Apps</h1><p>Enter the passcode to continue.</p>
<input id="pw" type="password" inputmode="numeric" autocomplete="off" aria-label="Passcode" autofocus>
<div class="err" id="err" role="alert"></div>
<button class="go" type="submit">Unlock</button>
</form>
<section id="apps" hidden>
<h1>Choose an app</h1><p>Tap an app to open it.</p>
<a class="card" href="https://lcastellano03.github.io/Scale-Logger/"><div>Scale Logger<small>Log scale readings</small></div><span>&rsaquo;</span></a>
<a class="card" href="https://lcastellano03.github.io/Servo-Press-QC/"><div>Servo Press QC<small>Shaft, bearing &amp; flux ring press checks</small></div><span>&rsaquo;</span></a>
<a class="card" href="https://lcastellano03.github.io/Glue-Program/"><div>Glue Program Calculator<small>Glue program calculator</small></div><span>&rsaquo;</span></a>
<button class="lock" id="lock" type="button">Lock</button>
</section>
</main>
<script>
(function(){
var HASH="698eddbc91b225fd427a99e6d0c194e32cb8c99dd4322cb25c5cd52c52184ef2",KEY="shopapps-unlocked";
var gate=document.getElementById("gate"),apps=document.getElementById("apps"),pw=document.getElementById("pw"),err=document.getElementById("err");
function show(on){gate.hidden=on;apps.hidden=!on;if(!on)pw.focus()}
function stored(){try{return sessionStorage.getItem(KEY)===HASH}catch(e){return false}}
function sha(s){return crypto.subtle.digest("SHA-256",new TextEncoder().encode(s)).then(function(d){return Array.from(new Uint8Array(d)).map(function(x){return x.toString(16).padStart(2,"0")}).join("")})}
gate.addEventListener("submit",function(ev){ev.preventDefault();sha(pw.value.trim()).then(function(h){
if(h===HASH){try{sessionStorage.setItem(KEY,HASH)}catch(e){}err.textContent="";pw.value="";show(true)}
else{err.textContent="Incorrect passcode";pw.value="";pw.focus()}})});
document.getElementById("lock").addEventListener("click",function(){try{sessionStorage.removeItem(KEY)}catch(e){}show(false)});
show(stored());
})();
</script></body></html>
