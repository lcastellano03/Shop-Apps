<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Servo Press QC</title>
<style>
:root{--navy:#221E32;--btn:#291E44;--purple:#53478A;--lav:#A0AED1;--white:#fff;--err:#A8261D;
--f:Arial,"Helvetica Neue",Helvetica,system-ui,sans-serif}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--white);color:var(--navy);font-family:var(--f);line-height:1.4;display:flex;flex-direction:column}
.top{flex:none;padding:10px 20px;background:var(--white);border-bottom:1px solid #e3e0ec;display:flex;align-items:center}
.logo{display:flex}.logo img{height:56px;width:auto;display:block}
.hero{flex:none;background:var(--navy);color:var(--white);text-align:center;padding:40px 16px}
.hero h1{color:var(--white);margin:0 0 6px;font-size:30px;letter-spacing:.04em;text-transform:uppercase}
.hero p{margin:0;color:var(--lav);font-size:16px}
main{flex:1;width:100%;max-width:560px;margin:0 auto;padding:32px 16px 48px}
h1{font-size:30px;font-weight:700;margin:0 0 6px;text-align:center;color:var(--navy)}
p{margin:0 0 20px;color:var(--purple);text-align:center}
.box{background:var(--white);border:1px solid var(--lav);border-radius:6px;padding:24px;max-width:340px;margin:0 auto;text-align:center}
.box h1{font-size:24px}
input{width:100%;font-size:24px;text-align:center;letter-spacing:.4em;padding:10px;border:1px solid var(--lav);border-radius:4px;background:var(--white);color:var(--navy)}
button.go{margin-top:12px;width:100%;font-size:16px;padding:12px;border:0;border-radius:4px;background:var(--btn);color:var(--white);font-weight:700;cursor:pointer}
button.go:hover{background:var(--purple)}
input:focus-visible,button:focus-visible,a.card:focus-visible{outline:3px solid var(--purple);outline-offset:2px}
.err{color:var(--err);min-height:1.3em;margin-top:8px;font-size:14px}
a.card{display:flex;justify-content:space-between;align-items:center;padding:20px 22px;margin:0 0 12px;background:var(--lav);border-radius:4px;color:var(--navy);text-decoration:none;font-weight:700;font-size:20px}
a.card small{display:block;font-weight:400;font-size:14px;color:var(--navy);opacity:.85}
a.card span{font-size:28px}
a.card.alt{background:var(--white);border:2px solid var(--lav);margin-top:20px}
a.card:hover,a.card.alt:hover{background:var(--purple);color:var(--white);border-color:var(--purple)}
a.card:hover small{color:var(--white)}
.lock{display:block;margin:16px auto 0;background:var(--btn);border:0;border-radius:4px;color:var(--white);cursor:pointer;font-size:14px;font-weight:700;padding:10px 28px;font-family:inherit}
.lock:hover{background:var(--purple)}
[hidden]{display:none!important}
</style></head>
<body>
<script src="gate.js"></script>
<header class="top"><span class="logo"><img src="logo.png" alt="Unusual Machines"></span></header>
<div class="hero"><h1>Servo Press QC</h1><p>Press setup and quality checks</p></div>
<main>
<h1 class="h">Press QC reports</h1>
<p>Select a press to open its QC report.</p>
<a class="card" href="shaft-press-qc.html">Shaft press QC <span aria-hidden="true">›</span></a>
<a class="card" href="bearing-press-qc.html">Bearing press QC <span aria-hidden="true">›</span></a>
<a class="card" href="flux-ring-press-qc.html">Flux ring press QC <span aria-hidden="true">›</span></a>
<a class="card alt" href="servo-press-qc-guide.html"><div>Setup guide<small>One-page overview of the method</small></div><span aria-hidden="true">›</span></a>
</main>
</body></html>
