<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Flux ring press QC</title>
<style>/* Unusual Machines theme (matches unusualmachines.com) */
:root{
  --ink:#291E44; --ink-2:#53478A; --page:#FFFFFF; --panel:#FFFFFF; --lav:#E3E7F2; --lav-2:#F2F4FA; --edge:#C5CDE3; --edge-2:#A0AED1;
  --text:#221E32; --muted:#5A5670; --go:#1B6E3A; --go-bg:#E2F1E7; --go-edge:#9CCDAE; --stop:#A8261D; --stop-bg:#FBE7E4; --stop-edge:#EBA9A2;
  --wait-bg:#EEF0F8; --on-ink:#FFFFFF; --focus:#53478A; --btn:#291E44; --navy:#221E32;
  --f:Arial,"Helvetica Neue",Helvetica,system-ui,sans-serif; --fc:Arial,"Helvetica Neue",Helvetica,system-ui,sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --ink:#C9D1EA; --ink-2:#A0AED1; --page:#1A1727; --panel:#221E32; --lav:#2E2948; --lav-2:#28243C; --edge:#3E3760; --edge-2:#53478A;
  --text:#EEEDF5; --muted:#B0ADC4; --go:#7FD39C; --go-bg:#16301F; --go-edge:#2D6A43; --stop:#FF9A8F; --stop-bg:#3A1A17; --stop-edge:#7A3A33;
  --wait-bg:#28243C; --on-ink:#221E32; --focus:#A0AED1; --btn:#53478A; --navy:#A0AED1; color-scheme: dark;}}
:root[data-theme="dark"]{
  --ink:#C9D1EA; --ink-2:#A0AED1; --page:#1A1727; --panel:#221E32; --lav:#2E2948; --lav-2:#28243C; --edge:#3E3760; --edge-2:#53478A;
  --text:#EEEDF5; --muted:#B0ADC4; --go:#7FD39C; --go-bg:#16301F; --go-edge:#2D6A43; --stop:#FF9A8F; --stop-bg:#3A1A17; --stop-edge:#7A3A33;
  --wait-bg:#28243C; --on-ink:#221E32; --focus:#A0AED1; --btn:#53478A; --navy:#A0AED1; color-scheme: dark;}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--page);color:var(--text);font-family:var(--f);font-size:17px;line-height:1.55;-webkit-text-size-adjust:100%}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
img{max-width:100%}
.top{display:flex;align-items:center;gap:14px;padding:10px 20px;background:var(--btn);color:#fff}
.logo{flex:none;background:#fff;border-radius:8px;padding:3px 8px;display:flex;align-items:center;height:42px}
.logo img{height:36px;width:auto;display:block}
.brand{font-family:var(--fc);font-weight:600;font-size:22px;letter-spacing:.2px;line-height:1.1}
.brand small{display:block;font-family:var(--f);font-weight:400;font-size:13px;opacity:.8;letter-spacing:0}
.top .sp{flex:1}
#savestate{font-size:13px;opacity:.85;white-space:nowrap}
#nav{display:flex;gap:4px}
#nav .lnk{color:#fff;opacity:.9}
.notice{margin:0;padding:8px 20px;background:var(--lav);color:var(--ink);font-size:14px}
main{max-width:1120px;margin:0 auto;padding:24px 20px 60px}
h1{font-family:var(--fc);font-weight:600;font-size:34px;line-height:1.1;margin:0 0 10px;color:var(--ink)}
h2{font-family:var(--fc);font-weight:600;font-size:24px;margin:0;color:var(--ink)}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 20px;border-radius:10px;border:1.5px solid var(--edge-2);background:var(--panel);color:var(--ink);font-weight:600;cursor:pointer}
.btn:hover{background:var(--lav-2)}
.btn.primary{background:var(--btn);border-color:var(--btn);color:#fff}
:root[data-theme="dark"] .btn.primary{background:var(--ink);border-color:var(--ink);color:var(--on-ink)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.primary{background:var(--ink);border-color:var(--ink);color:var(--on-ink)}}
.btn[disabled]{opacity:.45;cursor:default}
.lnk{background:none;border:0;padding:6px 8px;color:var(--ink);font-weight:600;cursor:pointer;border-radius:6px}
.lnk:hover{text-decoration:underline}
.tag{display:inline-block;font-size:13px;font-weight:600;padding:2px 9px;border-radius:999px;border:1px solid transparent;white-space:nowrap}
.tag.go{background:var(--go-bg);color:var(--go);border-color:var(--go-edge)}
.tag.stop{background:var(--stop-bg);color:var(--stop);border-color:var(--stop-edge)}
.tag.wait{background:var(--lav);color:var(--ink)}
.note{font-size:14px;color:var(--muted);margin:6px 0 0}
.note.warn{color:var(--stop)}
.empty{color:var(--muted);padding:20px 0}

.hero{background:var(--panel);border:1px solid var(--edge);border-radius:16px;padding:28px;margin-bottom:28px;border-left:8px solid var(--btn)}
.hero p{max-width:60ch;color:var(--muted);margin:0 0 18px}
.listhead{display:flex;align-items:baseline;justify-content:space-between;margin:0 0 10px}
.runs{list-style:none;margin:0 0 28px;padding:0;border:1px solid var(--edge);border-radius:12px;overflow:hidden;background:var(--panel)}
.runrow{display:grid;grid-template-columns:minmax(0,1fr) auto auto;align-items:center;gap:10px;padding:6px 12px 6px 0;border-top:1px solid var(--edge)}
.runrow:first-child{border-top:0}
.runrow:nth-child(even){background:var(--lav-2)}
.runopen{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;text-align:left;background:none;border:0;padding:10px 16px;cursor:pointer}
.runopen:hover .rn{text-decoration:underline}
.rn{font-weight:600;color:var(--ink)}
.rm{grid-column:1;font-size:14px;color:var(--muted)}
.rt{grid-column:2;grid-row:1/3;font-size:13px;color:var(--muted);align-self:center}
.rx{display:flex}
.card{background:var(--panel);border:1px solid var(--edge);border-radius:12px;padding:4px 18px;margin-top:18px}
.card summary{cursor:pointer;font-weight:600;color:var(--ink);padding:12px 0}
.card ol{margin:0 0 14px;padding-left:22px}
.card li{margin:4px 0}
.fig{display:block;background:#fff;border-radius:10px;padding:10px;margin:8px 0 12px;border:1px solid var(--edge)}

.runwrap{display:grid;grid-template-columns:250px minmax(0,1fr);gap:28px;align-items:start}
.rail{position:sticky;top:12px;background:var(--panel);border:1px solid var(--edge);border-radius:14px;padding:14px}
.runname{font-weight:600;color:var(--ink);margin:0 0 10px;overflow-wrap:anywhere}
.rail ol{list-style:none;margin:0;padding:0}
.rail li{display:grid;grid-template-columns:30px minmax(0,1fr);gap:2px 10px;padding:8px 6px;border-radius:10px}
.rail li.cur{background:var(--lav)}
.pn{grid-row:1/3;width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--fc);font-weight:600;background:var(--lav);color:var(--ink);border:1px solid var(--edge-2)}
.rail li.cur .pn{background:var(--btn);color:#fff;border-color:var(--btn)}
.pt{font-weight:600;font-size:15px}
.dots{display:flex;flex-wrap:wrap;gap:5px}
.dot{width:16px;height:16px;border-radius:50%;border:1.5px solid var(--edge-2);background:transparent;padding:0;cursor:pointer}
.dot.done{background:var(--edge-2)}
.dot.on{background:var(--btn);border-color:var(--btn);transform:scale(1.15)}
.dot[disabled]{cursor:default;opacity:.5}

.step{background:var(--panel);border:1px solid var(--edge);border-radius:16px;padding:26px 28px 24px;min-width:0}
.loc{font-size:14px;color:var(--muted);margin-bottom:4px}
.body p{margin:0 0 8px;max-width:68ch}
.fields{display:flex;flex-direction:column;gap:14px;margin:18px 0}
.f{display:flex;flex-direction:column;gap:6px;max-width:420px}
.f>span{font-weight:600;font-size:15px}
.f i{font-style:normal;font-weight:400;color:var(--muted);font-size:13px}
input[type=text],select{min-height:52px;border:1.5px solid var(--edge-2);border-radius:10px;background:var(--lav-2);padding:0 14px;font-size:20px;width:100%}
input[type=text]:focus{background:var(--panel);border-color:var(--focus);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--focus) 30%,transparent)}
input.bad{border-color:var(--stop);background:var(--stop-bg)}
.numin{display:flex;align-items:center;gap:8px}
.numin input{max-width:220px;font-variant-numeric:tabular-nums}
.numin em{font-style:normal;color:var(--muted)}
.chk{display:flex;gap:14px;align-items:center;padding:14px 16px;border:1.5px solid var(--edge-2);border-radius:12px;background:var(--lav-2);cursor:pointer;max-width:620px;font-weight:600}
.chk input{width:28px;height:28px;accent-color:var(--btn);flex:none}
.yn{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;justify-content:space-between;max-width:620px;padding:10px 0;border-bottom:1px solid var(--edge)}
.yn>span{font-weight:600;display:flex;flex-direction:column}
.yn small{font-weight:400;color:var(--muted);font-size:14px}
.seg{display:flex;border:1.5px solid var(--edge-2);border-radius:10px;overflow:hidden}
.seg button{min-height:48px;min-width:110px;padding:0 16px;border:0;background:var(--panel);cursor:pointer;font-weight:600}
.seg button+button{border-left:1.5px solid var(--edge-2)}
.seg button.sel.g{background:var(--go-bg);color:var(--go)}
.seg button.sel.b{background:var(--stop-bg);color:var(--stop)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.cell{display:grid;grid-template-columns:minmax(0,1fr);gap:4px;padding:10px;border:1px solid var(--edge);border-radius:12px;background:var(--panel)}
.cell .id{font-family:var(--fc);font-weight:600;font-size:18px;color:var(--ink);display:flex;flex-direction:column}
.cell .id small{font-family:var(--f);font-weight:400;font-size:13px;color:var(--muted)}
.cell input{font-variant-numeric:tabular-nums}
.prev{font-size:13px;color:var(--muted);min-height:18px}
.mv{font-size:13px;font-weight:700;color:var(--stop)}
.cell.moved{border-color:var(--stop-edge);background:var(--stop-bg)}
.file{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.file input{position:absolute;opacity:0;width:1px;height:1px}
.file:focus-within .btn{outline:3px solid var(--focus);outline-offset:2px}
.fname{color:var(--muted)}

.out:empty,.fields:empty{display:none}
.out{margin:6px 0 18px}
.levels{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px}
.lv{background:var(--lav);border-radius:12px;padding:10px 14px;display:flex;flex-direction:column}
.lv span{font-size:13px;color:var(--muted)}
.lv b{font-family:var(--fc);font-size:32px;line-height:1.1;color:var(--ink);font-variant-numeric:tabular-nums}
.lv em{font-style:normal;font-size:13px;color:var(--muted)}
.big{background:var(--lav);border-radius:14px;padding:14px 18px;display:inline-flex;flex-direction:column;min-width:220px;margin:10px 10px 10px 0}
.big span{font-size:14px;color:var(--muted)}
.big b{font-family:var(--fc);font-size:46px;line-height:1;color:var(--ink);font-variant-numeric:tabular-nums}
.big em{font-style:normal;color:var(--muted);font-size:14px}
.pair{display:flex;flex-wrap:wrap}
.kv{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:4px 18px;margin:8px 0;font-size:15px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-weight:600;font-variant-numeric:tabular-nums}
.tblwrap{overflow-x:auto;border:1px solid var(--edge);border-radius:12px}
table.seat{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:15px}
.seat th{background:var(--btn);color:#fff;font-weight:600;padding:8px 10px;text-align:center;white-space:nowrap}
.seat td{padding:7px 10px;text-align:center;border-top:1px solid var(--edge)}
.seat tbody tr:nth-child(even) td{background:var(--lav-2)}
.seat td.set{background:var(--go-bg)!important;color:var(--go);font-weight:600}
.checks{list-style:none;padding:0;margin:10px 0;display:flex;flex-direction:column;gap:6px}
.checks li{display:grid;grid-template-columns:62px minmax(0,1fr);gap:2px 12px;align-items:start}
.checks li .tag{text-align:center}
.checks small{grid-column:2;color:var(--muted);font-size:14px}
table.press{border-collapse:collapse;min-width:min(100%,420px);font-size:17px}
.press th{text-align:left;font-weight:400;color:var(--muted);padding:9px 20px 9px 0;border-bottom:1px solid var(--edge)}
.press td{padding:9px 0;border-bottom:1px solid var(--edge);font-variant-numeric:tabular-nums}
.press b{font-family:var(--fc);font-size:24px;color:var(--ink)}

.gate{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:14px;padding:16px 18px;border-radius:14px;border:2px solid var(--edge);background:var(--wait-bg);margin-top:8px}
.gate .gl{display:flex;align-items:center;gap:16px;min-width:0;flex:1 1 260px}
.gate .gl b{font-family:var(--fc);font-size:34px;line-height:1;letter-spacing:.5px;color:var(--ink);flex:none}
.gate .gl span{font-size:16px}
.gate.go{background:var(--go-bg);border-color:var(--go-edge)}
.gate.go .gl b{color:var(--go)}
.gate.stop{background:var(--stop-bg);border-color:var(--stop-edge)}
.gate.stop .gl b{color:var(--stop)}
.gate .gb{display:flex;gap:10px}
.gate .gb .btn{min-width:110px}
.gate.nudge{animation:nudge .32s ease}
@keyframes nudge{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
@media (prefers-reduced-motion: reduce){.gate.nudge{animation:none}}
.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:14px 0}

.settings fieldset{border:1px solid var(--edge);border-radius:12px;background:var(--panel);margin:0 0 16px;padding:12px 18px 16px;display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px 20px}
.settings legend{font-family:var(--fc);font-weight:600;font-size:20px;color:var(--ink);padding:0 6px}
.settings .f{max-width:none}
.settings input[type=text]{font-size:17px;min-height:44px}
.settings .chk{max-width:none}

.record{background:#fff;color:#1E1630;border:1px solid var(--edge);border-radius:12px;padding:28px;max-width:820px}
.record .rhead{display:flex;gap:18px;align-items:center;border-bottom:3px solid var(--btn);padding-bottom:14px;margin-bottom:10px}
.record .rhead img{height:56px}
.record h1{color:var(--btn);font-size:28px;margin:0}
.record h2{color:var(--btn);font-size:19px;margin:18px 0 6px}
.record table{border-collapse:collapse;width:100%;font-size:14px}
.record th{text-align:left;font-weight:400;color:#5E5573;padding:6px 10px;width:55%;border-bottom:1px solid #E9E3F5}
.record td{padding:6px 10px;font-weight:600;border-bottom:1px solid #E9E3F5}
.record tr:nth-child(even) th,.record tr:nth-child(even) td{background:#F6F3FC}
.record .sign{display:grid;grid-template-columns:1fr 1fr;gap:30px;margin-top:46px}
.record .sign div{border-top:1px solid #1E1630;padding-top:6px;font-size:13px;color:#5E5573}

@media (max-width:900px){
  .runwrap{grid-template-columns:minmax(0,1fr)}
  .rail{position:static;padding:10px 12px}
  .rail ol{display:flex;gap:6px;overflow-x:auto}
  .rail li{grid-template-columns:auto;padding:6px 8px;min-width:max-content}
  .rail li .pn{grid-row:auto}
  .rail .pt{font-size:13px}
  .runname{margin-bottom:6px}
  .step{padding:18px 16px}
  h1{font-size:28px}
}
@media (max-width:560px){
  .top{padding:8px 12px;gap:10px}
  .brand small{display:none}
  .brand{font-size:19px;white-space:nowrap;min-width:0;overflow:hidden;text-overflow:ellipsis}
  #savestate{display:none}
  .logo{height:38px}
  .logo img{height:30px}
  .runrow{grid-template-columns:minmax(0,1fr) auto;padding-right:8px}
  .rx{grid-column:1/-1;padding-left:10px}
  .gate .gb{width:100%}
  .gate .gb .btn{flex:1}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .seg button{min-width:90px}
}
.grid.wide{grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.multi{display:grid;gap:6px}
.sub{display:flex;flex-direction:column;gap:2px;min-width:0}
.sub small{font-size:12px;color:var(--muted)}
.mcell input[type=text]{min-height:44px;font-size:17px;padding:0 6px;text-align:center}
.wrow{display:flex;flex-direction:column;gap:2px}
.wl{font-size:13px;color:var(--muted);font-weight:600}
.dv{font-size:14px;font-weight:600;color:var(--ink);min-height:18px;font-variant-numeric:tabular-nums}
.cell.warn{border-color:var(--stop-edge);background:var(--stop-bg)}
.cell.warn .dv{color:var(--stop)}
.record .rnote{font-size:13px;margin:8px 0;padding:8px 10px;border:1px solid #CFC3EC;border-radius:6px}
@media (max-width:560px){.grid.wide{grid-template-columns:minmax(0,1fr)}}
@media (max-width:420px){.top .brand{font-size:16px}}
.savebtn{width:100%;margin-top:10px;min-height:44px}
.savebar{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;margin-top:12px}
.lastsave{font-size:13px;color:var(--muted)}
.svbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;background:var(--lav);border:1.5px solid var(--edge-2);border-radius:12px;padding:12px 14px;margin:0 0 14px}
.svbar .svb{display:flex;gap:10px;align-items:center}
.ovl{position:fixed;inset:0;background:rgba(30,22,48,.45);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.dlg{background:var(--panel);color:inherit;border-radius:14px;padding:20px;width:100%;max-width:480px;max-height:90vh;overflow:auto;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.dlg h2,.resume h2{margin:0 0 8px;font-size:20px;color:var(--ink)}
.dact{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0 4px}
.dlg textarea,.resume textarea{display:block;width:100%;font:13px/1.4 ui-monospace,Menlo,Consolas,monospace;border:1.5px solid var(--edge);border-radius:10px;padding:10px;background:var(--panel);color:inherit;margin:6px 0 10px}
.resume{background:var(--panel);border:1px solid var(--edge);border-radius:14px;padding:16px 18px;margin-top:16px}
@media (max-width:900px){.rail .savebtn{display:none}}
.pvbar{background:#FFF4D6;color:#6B4E00;border:1px solid #E8CF8A;border-radius:10px;padding:8px 12px;margin:0 0 12px;font-weight:600;font-size:14px}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .pvbar{background:#3A3016;color:#F2D98C;border-color:#6B5A2A}}
@media print{
  .top,.notice,.noprint{display:none!important}
  body{background:#fff}
  main{padding:0}
  .record{border:0;padding:0}
}
</style>
<style id="logo-fix">
.top{align-items:center;gap:18px;padding:12px 20px;background:var(--panel);color:var(--ink);border-bottom:4px solid var(--navy)}
.top .logo{flex:none;height:auto;padding:0;border-radius:0;background:transparent}
.top .logo img{flex:none;height:64px;width:auto;max-width:none;display:block}
.top .brand{min-width:0;color:var(--ink);white-space:normal;overflow:visible;font-size:24px}
.top .brand small{display:block;color:var(--muted);opacity:1}
#nav .lnk{color:var(--ink);opacity:1}
#savestate{color:var(--muted)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .top .logo{background:#fff;border-radius:8px;padding:3px 8px}}
:root[data-theme="dark"] .top .logo{background:#fff;border-radius:8px;padding:3px 8px}
@media(max-width:700px){
  .top{flex-wrap:wrap;gap:6px 12px;padding:10px 14px}
  .top .logo img{height:56px}
  .top .brand{flex:1 0 100%;order:3;font-size:21px}
  .top .brand small{display:block;font-size:13px}
  .top .sp{display:none}
  #nav{order:2;margin-left:auto}
  #savestate{order:2}
}
</style>
</head>
<body>
<script src="gate.js"></script>

<header class="top">
  <div class="logo"><img id="logoimg" alt="Unusual Machines"></div>
  <div class="brand">Flux ring press QC<small>Servo press setup, step by step</small></div>
  <div class="sp"></div>
  <span id="savestate" aria-live="polite"></span>
  <nav id="nav" aria-label="Main"></nav>
</header>
<p id="notice" class="notice" hidden></p>

          : ["Set LADDER to **{{L" + (l + 1) + "}} kgf**.", "Press the same {{ladderParts}} parts again, in the same order. Measure each one at the four positions and type the readings."]).concat(glue),
        fields: [{ t: "mgrid", k: "ladder." + l, n: c.ladderParts, ids: function (i) { return ID.ladder(i + 1, l + 1); }, pid: function (i) { return pid("P", i); }, prev: l > 0 ? "ladder." + (l - 1) : null },
          { t: "yesno", k: "ladderDamage." + l, label: "Any " + DMG + " at this level?", yes: "None", no: "Found some" }],
        gate: function (a, r, c) { if ((r.ladderDamage || [])[l] === "bad") return STOP("Damage was found at level " + (l + 1) + "."); var rg = rangeGate(r, c, "ladder." + l, c.ladderParts, function (i) { return ID.ladder(i + 1, l + 1); }); if (rg) return rg; if (!allNum(r.ladder[l], c.ladderParts)) return WAIT("Type all four readings for all " + c.ladderParts + " parts."); if ((r.ladderDamage || [])[l] !== "ok") return WAIT("Answer the damage question."); return GO(); } });
    })(l);
    st.push({ id: "ladderresult", part: 2, title: "Your production pressure", body: ["The app has worked out where each part stopped moving. Green cells are readings that no longer change."],
      out: function (a, r) { return seatTable(a) + resultBox(a, r); },
      gate: function (a, r, c) {
        var lr = a.ladder;
        if (lr.complete < c.minLadderComplete) return STOP("Only " + lr.complete + " parts have all their readings.");
        if (lr.moving > 0) return STOP(lr.moving + " part(s) were still moving at the top level.");
        if (!num(a.pprod)) return WAIT("Waiting for readings.");
        if (lr.message === "lower") return STOP("Today's pressure is more than " + c.lowerStopSteps + " steps above what is needed. {{contact}} decides whether to lower it.");
        return GO(lr.message === "raise" ? "Today's pressure leaves tight parts short. You will raise it to {{pprod}} kgf next." : "Today's pressure is about right.");
      } });

    st.push({ id: "prodset", part: 3, title: "Set the production pressure", body: ["In the flux ring **production program**, set the final-step pressure to **{{pprod}} kgf**."],
      fields: [{ t: "check", k: "done.prodset", label: "Production program is set to {{pprod}} kgf" }],
      gate: function (a, r) { return r.done.prodset ? GO() : WAIT("Tick the box when it is done."); } });
    st.push({ id: "confirm1", part: 3, title: "Press {{confirmParts}} new parts", body: ["Press {{confirmParts}} new flux rings one after another with the production program.", "Product numbers **C01** to **{{lastConfirm}}**. Measure each one at the four positions and type the readings."].concat(glue),
      fields: [{ t: "mgrid", k: "confirm.r1", n: c.confirmParts, ids: function (i) { return ID.confirm(i + 1); }, pid: function (i) { return pid("C", i); } },
        { t: "yesno", k: "confirmDamage", label: "Any " + DMG + " on the first {{damageParts}} parts?", yes: "None", no: "Found some" }],
      gate: function (a, r, c) { if (r.confirmDamage === "bad") return STOP("Damage was found at the production pressure."); var rg = rangeGate(r, c, "confirm.r1", c.confirmParts, function (i) { return ID.confirm(i + 1); }); if (rg) return rg; if (!allNum(r.confirm.r1, c.confirmParts)) return WAIT("Type all readings for all " + c.confirmParts + " parts."); if (r.confirmDamage !== "ok") return WAIT("Answer the damage question."); return GO(); } });
    st.push({ id: "confirm5", part: 3, title: "Press them again at the top level", body: ["Set LADDER to **{{Ltop}} kgf**.", "Press each of the {{confirmParts}} parts again. Product numbers **C01-L{{topLevel}}** and up.", "Measure each one again and type the readings. The app flags any part that moved."],
      fields: [{ t: "mgrid", k: "confirm.r5", n: c.confirmParts, ids: function (i) { return ID.confirmTop(i + 1, c); }, pid: function (i) { return pid("C", i); }, prev: "confirm.r1", flagMove: true }],
      gate: function (a, r, c) { var rg = rangeGate(r, c, "confirm.r5", c.confirmParts, function (i) { return ID.confirmTop(i + 1, c); }); if (rg) return rg; if (!allNum(r.confirm.r5, c.confirmParts)) return WAIT("Type all readings for all " + c.confirmParts + " parts."); return a.confirm.pass ? GO("No part moved. The production pressure seats every part.") : STOP(a.confirm.moved + " part(s) moved when pressed again."); } });

    st.push({ id: "export1", part: 4, title: "Load the press data", body: ["Export the press data to USB (see the export card). Set the start time to before your first ladder press.", "Choose the file here."],

      out: function (a) { return exportSummary(a) + (a.shortTargets ? kv([["Fully seated position", fX(a.xSeat) + " mm"]].concat(a.shortTargets.map(function (v, i) { return ["Short target " + (i + 1), fX(v) + " mm"]; }))) : ""); },
      gate: function (a, r, c) { if (!r.exportData) return WAIT("Choose the export file."); if (a.seatCount < c.minLadderComplete) return STOP("Only " + a.seatCount + " of " + c.ladderParts + " top-level ladder presses were found in the file. Check the product numbers."); return GO(); } });
    st.push({ id: "shortprog", part: 4, title: "Make the SHORT program", body: ["On the press, copy the flux ring production program. Name the copy **SHORT**.", "Change its **final step** to a **position step**. Type **{{short1}}** as the position.", "Change nothing else."],
      fields: [{ t: "check", k: "done.shortprog", label: "SHORT program is made" }],
      gate: function (a, r) { return r.done.shortprog ? GO() : WAIT("Tick the box when it is done."); } });
    st.push({ id: "shortparts", part: 4, title: "Press {{nShort}} short parts", body: ["Press one new flux ring at each position below, changing the SHORT position between parts.", "Measure each one at the four positions and type the readings.", "Mark them SHORT and set them aside. Never put them in production."],
      fields: [{ t: "mgrid", k: "short", n: c.shortOffsets.length, ids: function (i) { return ID.shortPart(i + 1); }, pid: function (i) { return pid("S", i); }, sub: function (i, a) { return "Position " + fX(a.shortTargets ? a.shortTargets[i] : null); } }],
      gate: function (a, r, c) { return allNum(r.short, c.shortOffsets.length) ? GO() : WAIT("Type all readings."); } });

    st.push({ id: "run", part: 5, title: "Run {{runParts}} parts", body: ["With the flux ring **production program**, run {{runParts}} parts one after another in normal production.", "Product numbers **R01** to **{{lastRun}}**. Do not measure them."],
      fields: [{ t: "check", k: "done.run", label: "{{runParts}} parts are run with product numbers R01 to {{lastRun}}" }],
      gate: function (a, r) { return r.done.run ? GO() : WAIT("Tick the box when it is done."); } });
    st.push({ id: "export2", part: 5, title: "Load the press data again", body: ["Export the press data again, from before your first ladder press until now.", "Choose the new file. It replaces the old one."],
      fields: [{ t: "file", k: "exportData", flag: "export2" }],
      out: function (a) { return exportSummary(a) + kv([["Run parts found", a.run.matched + " of " + a.cfg.runParts], ["Short parts found", a.shorts.filter(function (s) { return s.matched; }).length + " of " + a.shorts.length]]); },
      gate: function (a, r, c) { if (!r.export2) return WAIT("Choose the new export file."); if (a.run.matched < c.minRunParts) return STOP("Only " + a.run.matched + " run parts were found in the file."); if (a.shorts.some(function (s) { return !s.matched; })) return STOP("A short part is missing from the file."); return GO(); } });
    st.push({ id: "limits", part: 5, title: "Your QC min and max", body: ["The app sets the window from your {{runParts}} run parts: the run average, plus and minus {{sigma}} standard deviations."],
      out: function (a) { return limitsBox(a) + windowNote(a); },
      gate: function (a) { var bad = a.limits.checks.filter(function (x) { return x.state !== "PASS"; }); if (a.limits.mode === "window" && !bad.length) return GO(); if (bad.some(function (x) { return x.state === "WAIT"; })) return WAIT("Waiting for data."); return STOP("Not every check passed: " + bad.map(function (x) { return x.label.toLowerCase(); }).join(", ") + "."); } });

    st.push({ id: "enterqc", part: 6, title: "Type the QC on the press", body: ["In the flux ring **production program**, open **Quality inspection, condition 1** and type these values.", "Then turn **Quality inspection enable** ON."],
      out: function (a) { return pressValues(a); },
      fields: [{ t: "check", k: "done.enterqc", label: "Values are typed and Quality inspection is ON" }],
      gate: function (a, r) { return r.done.enterqc ? GO() : WAIT("Tick the box when it is done."); } });
    st.push({ id: "shortqc", part: 6, title: "Turn QC on in SHORT", body: ["Open the **SHORT** program. Type the same condition 1 values. Turn Quality inspection enable ON."],
      fields: [{ t: "check", k: "done.shortqc", label: "SHORT has the same QC values and QC is ON" }],
      gate: function (a, r) { return r.done.shortqc ? GO() : WAIT("Tick the box when it is done."); } });
    var badFields = [];
    c.shortOffsets.forEach(function (o, i) { badFields.push({ t: "okng", k: "challenge.res." + i, label: ID.test(i + 1) + " press result", sub: function (a) { return "SHORT position " + fX(a.shortTargets ? a.shortTargets[i] : null); } }); });
    badFields.push({ t: "mgrid", k: "challenge.val", n: c.shortOffsets.length, ids: function (i) { return ID.test(i + 1); }, pid: function (i) { return pid("T", i); } });
    st.push({ id: "badtest", part: 6, title: "Bad part test", body: ["Use the **SHORT** program.", "Press one new flux ring at each SHORT position. Product numbers **T01** and up.", "Type the press result (OK or NG), then measure the part at the four positions and type the readings."],
      fields: badFields,
      gate: function (a, r, c) { var t = a.verify.tests.slice(0, c.shortOffsets.length); if (t.some(function (x) { return x.check === "FAIL"; })) return STOP("A test part did not give the expected result."); if (t.every(function (x) { return x.check === "PASS"; }) && allNum(r.challenge.val, c.shortOffsets.length)) return GO("Every short part was caught."); return WAIT("Fill in every result and reading."); } });
    var si = c.shortOffsets.length;
    st.push({ id: "shim", part: 6, title: "Shim test", body: ["Lay the **{{shim}} mm** feeler tab under the nest.", "With the **production program**, press one new flux ring. Product number **" + ID.test(si + 1) + "**.", "Type the press result. Take the shim out."],
      fields: [{ t: "okng", k: "challenge.res." + si, label: ID.test(si + 1) + " press result" }],
      gate: function (a) { var t = a.verify.tests[si]; if (!t.result) return WAIT("Choose OK or NG."); if (!t.expected) return WAIT("Waiting for limits."); return t.check === "PASS" ? GO() : STOP("The shim test did not give the expected result."); } });
    st.push({ id: "verdict", part: 6, title: "Release check", body: ["The app has checked everything from this run."],
      out: function (a) { return checklist(a) + windowNote(a); },
      gate: function (a) { return a.verify.release ? GO("RELEASE") : STOP("NOT READY. " + a.verify.checklist.filter(function (x) { return !x.pass; }).length + " check(s) failed."); } });
    st.push({ id: "release", part: 6, title: "Sign and finish", body: ["Type the program revision and your name. Then send the release record to {{contact}} to sign."],
      fields: [{ t: "text", k: "release.rev", label: "Program revision", ph: "Rev A" }, { t: "text", k: "release.by", label: "Your name", ph: "Name" }],
      out: function (a, r) { return '<div class="actions"><button class="btn" data-act="record">Open release record</button><button class="btn" data-act="runfile">Download run file</button><button class="btn" data-act="runxlsx">Download Excel</button></div><p class="note">Send the run file to {{contact}}. It holds everything from this run.</p>'.replace("{{contact}}", esc(cfgFor(r).contactName)); },
      gate: function (a, r) { return (r.release.rev && r.release.by) ? GO("Done. This run is complete.") : WAIT("Type the revision and your name."); } });
    return st;
  }

  /* ---------- output builders ---------- */
  function kv(rows) { return '<dl class="kv">' + rows.map(function (r) { return "<dt>" + esc(r[0]) + "</dt><dd>" + r[1] + "</dd>"; }).join("") + "</dl>"; }
  function seatTable(a) {
    var L = a.L; if (!L) return "";
    var h = '<div class="tblwrap"><table class="seat"><thead><tr><th>Part</th>' + L.list.map(function (v) { return "<th>" + fP(v) + "</th>"; }).join("") + "<th>Seats at</th></tr></thead><tbody>";
    a.ladder.parts.forEach(function (p) {
      h += "<tr><td>" + p.part + "</td>" + p.readings.map(function (v, i) { var on = p.seat && i >= p.seat - 1; return '<td class="' + (on ? "set" : "") + '">' + (num(v) ? v.toFixed(3) : "") + "</td>"; }).join("") + "<td><b>" + (p.seatP ? fP(p.seatP) : "") + "</b>" + (p.flag === "moving" ? ' <span class="tag stop">moving</span>' : "") + "</td></tr>";
    });
    return h + "</tbody></table></div><p class='note'>Columns are pressure levels in kgf. Readings are ring recess below the rim in mm, the mean of four positions.</p>";
  }
  function resultBox(a, r) {
    var lr = a.ladder; if (!num(a.pprod)) return "";
    var raw = num(lr.pprodRaw) ? lr.pprodRaw : null;
    return '<div class="big"><span>Production pressure</span><b>' + fP(a.pprod) + '</b><em>kgf</em></div>' +
      kv([["Today's pressure", fP(r.P0) + " kgf"], ["Tightest part seated at", fP(lr.pmax) + " kgf"], ["Calculated before rounding", fP(raw) + " kgf"]].concat(num(r.pprodOverride) ? [["Owner override", fP(r.pprodOverride) + " kgf"]] : []));
  }
  function exportSummary(a) {
    var r = S.run; if (!r.exportData) return "";
    return kv([["File", esc(r.exportData.name || "")], ["Press rows read", String(a.exportCount)], ["Ladder presses found", a.ladderMatched + " of " + a.cfg.ladderParts * a.cfg.levels]]) + (r.exportData.headerFound === false ? '<p class="note warn">Column names were not found, so the default column positions were used. Check the numbers look right.</p>' : "");
  }
  function limitsBox(a) {
    var L = a.limits;
    var h = '<div class="pair"><div class="big"><span>QC min</span><b>' + fX(L.qcMin) + '</b><em>mm</em></div><div class="big"><span>QC max</span><b>' + fX(L.qcMax) + '</b><em>mm</em></div></div>';
    h += '<ul class="checks">' + L.checks.map(function (x) { return '<li><span class="tag ' + (x.state === "PASS" ? "go" : x.state === "WAIT" ? "wait" : "stop") + '">' + x.state + "</span>" + esc(x.label) + "</li>"; }).join("") + "</ul>";
    return h;
  }
  function windowNote(a) {
    var L = a.limits; if (!num(L.qcMin)) return "";
    return '<p class="note">The window is the run average ± ' + L.sigma + ' standard deviations.' + (L.capped ? ' The min was raised to halfway between the run average and the closest short part, so that short part is still rejected.' : "") + "</p>";
  }
  function pressValues(a) {
    return '<table class="press"><tbody>' + [["Judgment condition", "Point detection", ""], ["Judgment mode", "Pressure mode", ""], ["Set value", fP(a.pqc), "kgf"], ["Upper limit", fX(a.limits.qcMax), "mm"], ["Lower limit", fX(a.limits.qcMin), "mm"]]
      .map(function (r) { return "<tr><th>" + r[0] + "</th><td><b>" + r[1] + "</b> " + r[2] + "</td></tr>"; }).join("") + "</tbody></table>";
  }
  function checklist(a) {
    return '<ul class="checks">' + a.verify.checklist.map(function (x) { return '<li><span class="tag ' + (x.pass ? "go" : "stop") + '">' + (x.pass ? "PASS" : "FAIL") + "</span>" + esc(x.label) + (x.pass ? "" : '<small>' + esc(x.fix) + "</small>") + "</li>"; }).join("") + "</ul>" +
      (num(a.verify.cpk) ? kv([["Cpk", fN(a.verify.cpk, 2)]]) : "");
  }

  /* ---------- storage ---------- */
  var LS = "fluxqc:";
  var MEM = {};
  function lsGet(k) { try { var v = localStorage.getItem(LS + k); if (v) return JSON.parse(v); } catch (e) { } return MEM[k] ? JSON.parse(MEM[k]) : null; }
  function lsSet(k, v) { var j = JSON.stringify(v); MEM[k] = j; try { localStorage.setItem(LS + k, j); return true; } catch (e) { return false; } }
  function setSave(t) { S.saveState = t; var el = document.getElementById("savestate"); if (el) el.textContent = t; }

  function listRuns() {
    if (S.mode === "db") {
      if (runsUnsub) return;
      runsUnsub = S.db.collection("runs").orderBy("updatedAt", "desc").limit(300).onSnapshot(function (snap) {
        S.runs = snap.docs.map(function (d) { var x = d.data(); return Object.assign({ id: d.id }, x); });
        loadProfiles(); if (S.view === "home") renderHome();
      }, function () { S.runs = []; if (S.view === "home") renderHome(); });
    } else {
      var idx = lsGet("index") || [];
      S.runs = idx.map(function (id) { var r = lsGet("run:" + id); return r ? Object.assign({ id: id }, r) : null; }).filter(Boolean).sort(function (a, b) { return b.updatedAt - a.updatedAt; });
    }
  }
  function loadProfiles() {
    if (!S.user || !S.user.profiles) return;
    var ids = S.runs.map(function (r) { return r.createdBy; }).filter(function (x) { return x && !(x in S.profiles); });
    if (!ids.length) return;
    S.user.profiles(ids).then(function (ps) { ids.forEach(function (i) { S.profiles[i] = (ps && ps[i] && ps[i].name) || ""; }); if (S.view === "home") renderHome(); }).catch(function () { });
  }
  function persist() {
    if (!S.run) return;
    if (S.preview) { setSave("Preview, not saved"); return; }
    dirty = true;
    if (!S.canWrite) { setSave("View only, not saved"); return; }
    setSave("Saving");
    clearTimeout(saveTimer);
    saveTimer = setTimeout(flush, 700);
  }
  function flush() {
    if (S.preview) { dirty = false; return; }
    if (saving || !dirty || !S.run) return;
    dirty = false; saving = true;
    var r = S.run; r.updatedAt = Date.now();
    var body = JSON.parse(JSON.stringify(r)); var id = body.id; delete body.id;
    var p;
    if (S.mode === "db") p = S.db.collection("runs").doc(id).set(body);
    else { p = Promise.resolve(lsSet("run:" + id, body)); var idx = lsGet("index") || []; if (idx.indexOf(id) < 0) { idx.push(id); lsSet("index", idx); } }
    p.then(function () { saving = false; setSave(S.mode === "db" ? "Saved" : "Saved on this device"); if (dirty) flush(); })
      .catch(function (e) {
        saving = false;
        if (e && e.code === "invalid_argument") { S.canWrite = false; setSave("View only, not saved"); }
        else if (e && e.code === "quota_exceeded") setSave("Storage is full. Tell " + S.settings.contactName + ".");
        else { setSave("Not saved, retrying"); dirty = true; setTimeout(flush, 1500 + Math.random() * 1000); }
      });
  }
  function loadSettings() {
    if (S.mode === "db") {
      settingsUnsub = S.db.doc("config/settings").onSnapshot(function (snap) {
        S.settings = QC.merge(QC.DEFAULTS, snap.exists ? snap.data() : {});
        render();
      }, function () { });
    } else { S.settings = QC.merge(QC.DEFAULTS, lsGet("settings") || {}); }
  }
  function saveSettings(obj) {
    if (S.mode === "db") return S.db.doc("config/settings").set(obj);
    lsSet("settings", obj); S.settings = QC.merge(QC.DEFAULTS, obj); return Promise.resolve();
  }

  /* ---------- views ---------- */
  function render() { if (S.view === "home") renderHome(); else if (S.view === "run") renderRun(); else if (S.view === "settings") renderSettings(); else if (S.view === "record") renderRecord(); }
  function header() {
    var nav = '<button class="lnk" data-act="home">Runs</button>' + (S.admin ? '<button class="lnk" data-act="settings">Settings</button>' : "") + (S.mode === "local" ? (S.owner ? '<button class="lnk" data-act="lock">Lock</button>' : '<button class="lnk" data-act="unlock">Owner</button>') : "");
    document.getElementById("nav").innerHTML = nav;
    var note = S.mode === "local" ? (lsOK() ? "Runs save on this device only. Use Save progress to keep a copy. When a run is finished, send its run file to " + S.settings.contactName + "." : "Runs are not kept in this viewer. Use Save progress to keep your place.") : (S.mode === "db" && !S.canWrite ? "You can view runs but not save. Ask " + S.settings.contactName + " for Contributor access." : "");
    document.getElementById("notice").textContent = note;
    document.getElementById("notice").hidden = !note;
  }
  function statusTag(r) { var s = r.status || "in progress"; var cls = s === "released" ? "go" : s === "stop" ? "stop" : "wait"; var txt = s === "released" ? "Complete" : s === "stop" ? "Stopped" : "In progress"; return '<span class="tag ' + cls + '">' + txt + "</span>"; }
  function whereText(r) { var c = cfgFor(r); var st = buildSteps(c); var i = Math.min(r.step || 0, st.length - 1); var p = st[i].part; return "Part " + p + ", " + PARTS[p - 1].title.toLowerCase(); }

  function renderHome() {
    S.view = "home"; header();
    var rows = S.runs.map(function (r) {
      return '<li class="runrow"><button class="runopen" data-act="open" data-id="' + esc(r.id) + '"><span class="rn">' + esc(r.name || "Untitled run") + '</span><span class="rm">' + esc(r.size || "") + " flux ring, " + esc(whereText(r)) + (S.profiles[r.createdBy] ? ", started by " + esc(S.profiles[r.createdBy]) : "") + '</span><span class="rt">' + esc(when(r.updatedAt)) + "</span></button>" + statusTag(r) + (S.dl ? '<span class="rx">' : '<span class="rx" hidden>') + '<button class="lnk" data-act="xlsx" data-id="' + esc(r.id) + '">Excel</button><button class="lnk" data-act="csv" data-id="' + esc(r.id) + '">CSV</button><button class="lnk" data-act="json" data-id="' + esc(r.id) + '">Run file</button></span></li>';
    }).join("");
    app.innerHTML = '<section class="home"><div class="hero"><h1>Flux ring press QC setup</h1><p>Follow the steps at the press. Type what you measure. The app works out the pressure and the QC window.</p>' +
      '<button class="btn primary" data-act="new">Start a new run</button>' + resumeBtn() + (S.owner ? ' <button class="btn" data-act="preview">Preview the steps</button><p class="note">Owner only. Click through every step without entering data. Nothing is saved.</p>' : '') + (S.owner && S.mode === "local" ? '<label class="file"><input type="file" accept=".json,application/json" multiple data-import="1"><span class="btn">Import run files</span></label><p class="note">Owner only. Load run files the specialists sent you, then use Export all runs.</p>' : '') + '</div>' +
      resumePanel() + '<div class="listhead"><h2>Runs</h2>' + (S.runs.length && S.dl ? '<button class="lnk" data-act="xlsxall">Export all runs</button>' : "") + "</div>" +
      (S.runs.length ? '<ul class="runs">' + rows + "</ul>" : '<p class="empty">No runs yet. Start one when you are at the press.</p>') +
      exportCard() + "</section>";
  }
  function exportCard() {
    return '<details class="card"><summary>How to export the press data</summary><ol>' +
      ["On the press open Running Interface, then Production report, then Export data.", "Set Start time to before your first ladder press. Set End time to now.", "Put the USB drive in the touch screen's USB port, not the controller's.", "Tap Export to USB flash drive. Wait until Export feedback changes from 000 to 001.", "Choose that file in the app when a step asks for it."]
        .map(function (x) { return "<li>" + esc(x) + "</li>"; }).join("") + "</ol></details>";
  }

    var el = e.target; var k = el.getAttribute("data-k"); if (!k || !S.run) return;
    if (el.type === "checkbox") return;
    if (el.getAttribute("data-num")) {
      var raw = el.value.trim().replace(",", "."), v = raw === "" ? null : parseFloat(raw);
      el.classList.toggle("bad", raw !== "" && (!isFinite(v) || !/^-?\d*\.?\d*$/.test(raw)));
      setP(S.run, k, isFinite(v) ? v : null);
    } else setP(S.run, k, el.value);
    persist(); refresh();
  });
  app.addEventListener("change", function (e) {
    var el = e.target;
    if (el.getAttribute("data-resume")) { if (el.files && el.files[0]) readResumeFile(el.files[0]); return; }
    if (el.getAttribute("data-import")) { if (el.files && el.files.length) importRuns(el.files); return; }
    if (el.getAttribute("data-file")) {
      var f = el.files && el.files[0]; if (!f) return;
      var flag = el.getAttribute("data-flag");
      readFile(f, function (text) {
        var c = cfgFor(S.run), p = QC.parseExport(text, c);
        if (p.error) { setSave(p.error); return; }
        S.run.exportData = { name: f.name, at: Date.now(), rows: p.rows, headerFound: p.headerFound };
        if (flag === "export2") S.run.export2 = true;
        persist(); renderRun();
      });
      return;
    }
    var k = el.getAttribute("data-k");
    if (k && el.type === "checkbox") { setP(S.run, k, el.checked); persist(); refresh(); }
    if (k && el.tagName === "SELECT") { setP(S.run, k, el.value); persist(); refresh(); }
  });
  app.addEventListener("keydown", function (e) {
    if (e.key !== "Enter") return;
    var el = e.target; if (!el.getAttribute || !el.getAttribute("data-num")) return;
    e.preventDefault();
    var ins = Array.prototype.slice.call(app.querySelectorAll("input[data-num]"));
    var i = ins.indexOf(el); if (i >= 0 && i < ins.length - 1) { ins[i + 1].focus(); ins[i + 1].select && ins[i + 1].select(); }
    else { var nx = app.querySelector('[data-act="next"]'); if (nx) nx.focus(); }
  });
  document.addEventListener("click", function (e) {
    var b = e.target.closest ? e.target.closest("[data-act],[data-v]") : null; if (!b) return;
    if (b.hasAttribute("data-v") && b.getAttribute("data-k")) {
      setP(S.run, b.getAttribute("data-k"), b.getAttribute("data-v"));
      var grp = b.parentNode; grp.querySelectorAll("button").forEach(function (x, i) { var on = x === b; x.className = on ? "sel " + (i ? "b" : "g") : ""; x.setAttribute("aria-pressed", on); });
      persist(); refresh(); return;
    }
    var act = b.getAttribute("data-act");
    if (act === "home") { flush(); S.run = null; S.preview = false; if (S.mode !== "db") setTimeout(function () { listRuns(); renderHome(); }, 50); else renderHome(); }
    else if (act === "settings") { flush(); renderSettings(); }
    else if (act === "new") {
      var r = newRun();
      r.id = S.mode === "db" ? S.db.collection("runs").doc().id : "r" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
      S.run = r; persist(); renderRun();
    }
    else if (act === "preview" && S.owner) { var pr = newRun(); pr.id = "preview"; pr.name = "Preview"; S.preview = true; S.run = pr; renderRun(); setSave("Preview, not saved"); window.scrollTo(0, 0); }
    else if (act === "open") openRun(b.getAttribute("data-id"));
    else if (act === "next") {
      var c = cfgFor(S.run), st = buildSteps(c);
      if (!S.preview && (!lastGate || lastGate.s !== "go")) { var gt = document.getElementById("gate"); if (gt) { gt.classList.remove("nudge"); void gt.offsetWidth; gt.classList.add("nudge"); } return; }
      if (S.run.step < st.length - 1) { S.partPrompt = (!S.preview && st[S.run.step + 1].part !== st[S.run.step].part) ? st[S.run.step].part : null; S.run.step++; S.run.reached = Math.max(S.run.reached || 0, S.run.step); persist(); renderRun(); window.scrollTo(0, 0); }
      else { flush(); S.run = null; S.preview = false; if (S.mode !== "db") setTimeout(function () { listRuns(); renderHome(); }, 50); else renderHome(); }
    }
    else if (act === "back") { S.partPrompt = null; if (S.run.step > 0) { S.run.step--; persist(); renderRun(); window.scrollTo(0, 0); } }
    else if (act === "goto") { S.partPrompt = null; S.run.step = +b.getAttribute("data-i"); persist(); renderRun(); }
    else if (act === "saveprog") openSaveDialog();
    else if (act === "dismissprompt") { S.partPrompt = null; var pb0 = document.querySelector(".svbar"); if (pb0) pb0.remove(); }
    else if (act === "showresume") toggleResume();
    else if (act === "resumetext") resumeFromText((document.getElementById("rstext") || {}).value);
    else if (act === "record") { flush(); renderRecord(); }
    else if (act === "back2run") renderRun();
    else if (act === "print") { try { window.print(); } catch (x) { } }
    else if (act === "dlrecord") save("flux_ring_qc_release_" + slug(S.run.name) + ".html", "<!doctype html><meta charset='utf-8'><title>Release record</title><style>" + RECORD_CSS + "</style>" + recordHTML(S.run));
    else if (act === "csv" || act === "xlsx" || act === "json") { var rr = S.runs.filter(function (x) { return x.id === b.getAttribute("data-id"); })[0]; if (rr) exportRun(rr, act); }
    else if (act === "xlsxall") exportAll();
    else if (act === "unlock") unlockOwner();
    else if (act === "lock") lockOwner();
    else if (act === "runfile") { flush(); exportRun(S.run, "json"); }
    else if (act === "runxlsx") { flush(); exportRun(S.run, "xlsx"); }
    else if (act === "savesettings") {
      var res = readSettingsForm(), msg = document.getElementById("setmsg");
      if (res.bad.length) { msg.textContent = "Check these values: " + res.bad.join(", "); return; }
      msg.textContent = "Saving";
      saveSettings(res.s).then(function () { msg.textContent = "Saved"; }).catch(function (e) { msg.textContent = e && e.code === "invalid_argument" ? "Only the owner or an editor can change settings." : "Not saved. Try again."; });
    }
    else if (act === "resetsettings") { saveSettings(QC.merge(QC.DEFAULTS, { gauge: S.settings.gauge, contactName: S.settings.contactName })).then(function () { renderSettings(); }); }
  });
  window.addEventListener("beforeunload", function () { flush(); });

  /* ---------- standalone: owner PIN and file downloads ---------- */
  var OWNER_PIN = "3220";
  function anchorSave(blob, name) {
    var url = URL.createObjectURL(blob), a = document.createElement("a");
    a.href = url; a.download = name; document.body.appendChild(a); a.click();
    setTimeout(function () { URL.revokeObjectURL(url); a.remove(); }, 1000);
  }
  var localDL = { save: function (o) {
    var blob;
    try { blob = o.data instanceof Blob ? o.data : new Blob([o.data], { type: "application/octet-stream" }); } catch (e) { return Promise.reject({ code: "error" }); }
    var touch = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
    try {
      if (touch && window.File && navigator.canShare && navigator.share) {
        var file = new File([blob], o.filename, { type: blob.type || "application/octet-stream" });
        if (navigator.canShare({ files: [file] })) {
          return navigator.share({ files: [file], title: o.filename }).catch(function (e) {
            if (e && e.name === "AbortError") return "cancelled";
            try { anchorSave(blob, o.filename); } catch (x) { setSave("Downloads are blocked in this viewer. Open the file in Safari or Chrome to download."); }
          });
        }
      }
      anchorSave(blob, o.filename);
      return Promise.resolve();
    } catch (e) { setSave("Downloads are blocked in this viewer. Open the file in Safari or Chrome to download."); return Promise.resolve(); }
  } };
  function unlockOwner() {
    if (document.getElementById("pinbox")) return;
    var d = document.createElement("div"); d.id = "pinbox";
    d.setAttribute("style", "position:fixed;inset:0;background:rgba(30,22,48,.45);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px");
    d.innerHTML = '<div role="dialog" aria-modal="true" aria-labelledby="pint" style="background:var(--panel,#fff);color:var(--text,#1E1630);border-radius:14px;padding:20px;width:100%;max-width:340px;box-shadow:0 10px 30px rgba(0,0,0,.25)"><h2 id="pint" style="margin:0 0 12px;font-size:20px;color:var(--ink,#3B2670)">Owner PIN</h2><input id="pinin" type="password" inputmode="numeric" autocomplete="off" aria-label="Owner PIN" style="width:100%;font-size:20px;padding:10px;border:1.5px solid #CFC3EC;border-radius:8px"><p id="pinerr" role="alert" style="color:#A8261D;min-height:20px;margin:8px 0;font-size:14px"></p><div style="display:flex;gap:8px"><button id="pinok" class="btn primary" type="button">Unlock</button><button id="pinx" class="btn" type="button">Cancel</button></div></div>';
    document.body.appendChild(d);
    var inp = document.getElementById("pinin"); inp.focus();
    function close() { d.remove(); }
    function go() {
      if (inp.value.trim() === OWNER_PIN) { close(); S.admin = true; S.owner = true; try { sessionStorage.setItem(LS + "owner", "1"); } catch (e) { } render(); }
      else { document.getElementById("pinerr").textContent = "That PIN is not right."; inp.select(); }
    }
    document.getElementById("pinok").addEventListener("click", go);
    document.getElementById("pinx").addEventListener("click", close);
    inp.addEventListener("keydown", function (e) { if (e.key === "Enter") go(); if (e.key === "Escape") close(); });
  }
  function lockOwner() { S.admin = false; S.owner = false; S.preview = false; try { sessionStorage.removeItem(LS + "owner"); } catch (e) { } S.run = null; renderHome(); }
  function lsOK() { try { localStorage.setItem("__t", "1"); localStorage.removeItem("__t"); return true; } catch (e) { return false; } }
  function importRuns(files) {
    var n = 0, left = files.length, bad = 0;
    Array.prototype.forEach.call(files, function (f) {
      var fr = new FileReader();
      fr.onload = function () {
        try {
          var o = JSON.parse(fr.result), r = o.run || o;
          if (!r || !r.id || !r.cfg) throw 0;
          var id = r.id, body = JSON.parse(JSON.stringify(r)); delete body.id;
          lsSet("run:" + id, body); var idx = lsGet("index") || []; if (idx.indexOf(id) < 0) { idx.push(id); lsSet("index", idx); } n++;
        } catch (e) { bad++; }
        if (--left === 0) { listRuns(); renderHome(); setSave(n + " run file(s) imported" + (bad ? ", " + bad + " could not be read" : "")); }
      };
      fr.readAsText(f);
    });
  }

  /* ---------- save progress and resume ---------- */
  var PROG_PREFIX = "flux_ring_qc_";
  function stamp() { var d = new Date(), p = function (n) { return (n < 10 ? "0" : "") + n; }; return d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate()) + "-" + p(d.getHours()) + p(d.getMinutes()); }
  function progressText(r) { return JSON.stringify({ kind: "qc-progress", app: r.app, savedAt: Date.now(), run: r }); }
  function railSave() { return S.preview ? "" : '<button class="btn savebtn" data-act="saveprog" type="button">Save progress</button>'; }
  function savedLine(r) { return r.fileSavedAt ? "Last saved to a file: " + esc(when(r.fileSavedAt)) : "Not saved to a file yet"; }
  function saveBar(r) { return S.preview ? "" : '<div class="savebar"><button class="lnk" data-act="saveprog" type="button">Save progress</button><span class="lastsave" id="lastsave">' + savedLine(r) + "</span></div>"; }
  function partBanner() {
    if (!S.partPrompt || S.preview) return "";
    var p = PARTS[S.partPrompt - 1];
    return '<div class="svbar" role="status"><span><b>Part ' + S.partPrompt + " is done (" + esc(p.title.toLowerCase()) + ").</b> Save your progress before you go on.</span>" +
      '<span class="svb"><button class="btn" data-act="saveprog" type="button">Save progress</button><button class="lnk" data-act="dismissprompt" type="button">Not now</button></span></div>';
  }
  function openSaveDialog() {
    if (!S.run || S.preview || document.getElementById("savebox")) return;
    flush();
    var r = S.run, c = cfgFor(r), steps = buildSteps(c), i = Math.min(r.step || 0, steps.length - 1);
    var text = progressText(r), fname = PROG_PREFIX + "progress_" + slug(r.name) + "_" + stamp() + ".json";
    var d = document.createElement("div"); d.id = "savebox"; d.className = "ovl";
    d.innerHTML = '<div class="dlg" role="dialog" aria-modal="true" aria-labelledby="svt"><h2 id="svt">Save progress</h2>' +
      "<p>This keeps everything you have entered and the step you are on (step " + (i + 1) + " of " + steps.length + "). You can pick the run up again later from the start screen.</p>" +
      '<div class="dact"><button class="btn primary" id="svfile" type="button">Save file</button><button class="btn" id="svclose" type="button">Close</button></div>' +
      '<p class="note" id="svmsg" aria-live="polite"></p>' +
      '<details id="svdet"><summary>Cannot save a file? Copy the text instead</summary><p class="note">Copy all of the text below and paste it somewhere safe, such as a Teams chat with yourself. To resume, paste it into the box on the start screen.</p>' +
      '<textarea id="svtext" readonly rows="4" aria-label="Progress text"></textarea><button class="btn" id="svcopy" type="button">Copy text</button></details></div>';
    document.body.appendChild(d);
    var ta = document.getElementById("svtext"); ta.value = text;
    function msg(t) { document.getElementById("svmsg").textContent = t; }
    function mark() {
      r.fileSavedAt = Date.now(); persist();
      var ls = document.getElementById("lastsave"); if (ls) ls.textContent = savedLine(r);
      S.partPrompt = null; var pb = document.querySelector(".svbar"); if (pb) pb.remove();
    }
    function close() { document.removeEventListener("keydown", onKey); d.remove(); }
    function onKey(e) { if (e.key === "Escape") close(); }
    document.addEventListener("keydown", onKey);
    document.getElementById("svclose").addEventListener("click", close);
    document.getElementById("svfile").addEventListener("click", function () {
      if (!S.dl) { document.getElementById("svdet").open = true; msg("Files cannot be saved here. Use the text below instead."); return; }
      S.dl.save({ filename: fname, data: text }).then(function (res) {
        if (res === "cancelled") { msg("Not saved. Tap Save file to try again."); return; }
        mark(); msg("Done. Keep the file where you can find it, such as a Teams chat with yourself. If no file appeared, use the text below.");
      }).catch(function () { document.getElementById("svdet").open = true; msg("The file could not be saved. Use the text below instead."); });
    });
    document.getElementById("svcopy").addEventListener("click", function () {
      function ok() { msg("Copied. Paste it somewhere safe."); mark(); }
      function manual() {
        ta.focus(); ta.select(); try { ta.setSelectionRange(0, ta.value.length); } catch (e) { }
        var good = false; try { good = document.execCommand("copy"); } catch (e) { }
        if (good) ok(); else msg("Press and hold the text, choose Select All, then Copy.");
      }
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(ok, manual); else manual();
    });
    document.getElementById("svfile").focus();
  }
  function resumeBtn() { return S.mode === "local" ? ' <button class="btn" data-act="showresume" type="button">Resume a saved run</button>' : ""; }
  function resumePanel() {
    if (S.mode !== "local") return "";
    return '<div id="resumebox" class="resume" hidden><h2>Resume a saved run</h2><p class="note">Choose the progress file you saved. The run opens on the step where you stopped.</p>' +
      '<label class="file"><input type="file" accept=".json,application/json,text/plain" data-resume="1"><span class="btn">Choose progress file</span></label>' +
      '<p class="note">No file? Paste the saved text here instead.</p><textarea id="rstext" rows="4" aria-label="Saved progress text"></textarea>' +
      '<div class="dact"><button class="btn" data-act="resumetext" type="button">Resume from text</button></div><p class="note" id="rsmsg" aria-live="polite"></p></div>';
  }
  function toggleResume() { var b = document.getElementById("resumebox"); if (!b) return; b.hidden = !b.hidden; if (!b.hidden && b.scrollIntoView) { try { b.scrollIntoView({ block: "nearest" }); } catch (e) { } } }
  function resumeMsg(t) { var m = document.getElementById("rsmsg"); if (m) m.textContent = t; }
  function readResumeFile(f) { var fr = new FileReader(); fr.onload = function () { resumeFromText(fr.result); }; fr.onerror = function () { resumeMsg("That file could not be read."); }; fr.readAsText(f); }
  function resumeFromText(text) {
    var o; try { o = JSON.parse(String(text || "").trim()); } catch (e) { resumeMsg("That is not saved progress. Choose the .json file, or paste all of the text."); return; }
    var r = o && (o.run || o);
    if (!r || typeof r !== "object" || !r.id || !r.cfg || typeof r.step !== "number") { resumeMsg("That file does not hold a saved run."); return; }
    var mine = newRun().app;
    if (r.app && r.app !== mine) { resumeMsg("This is a " + (r.press || "different press") + " run. Open the " + (r.press || "matching") + " app to resume it."); return; }
    var id = r.id, local = lsGet("run:" + id), keepLocal = !!(local && (local.updatedAt || 0) > (r.updatedAt || 0));
    if (!keepLocal) { var body = JSON.parse(JSON.stringify(r)); delete body.id; lsSet("run:" + id, body); }
    var idx = lsGet("index") || []; if (idx.indexOf(id) < 0) { idx.push(id); lsSet("index", idx); }
    listRuns(); S.partPrompt = null; openRun(id);
    setSave(keepLocal ? "This device already had a newer copy of this run, so that one was opened." : "Run resumed on step " + ((r.step || 0) + 1));
  }

  /* ---------- start ---------- */
  function start(mode) {
    S.mode = mode; loadSettings(); listRuns(); render();
  }
  app.innerHTML = '<p class="empty">Connecting</p>';
  var cl = window.claude && window.claude.use ? window.claude : null;
  if (!cl) { S.dl = localDL; try { if (sessionStorage.getItem(LS + "owner") === "1") { S.admin = true; S.owner = true; } } catch (e) { } start("local"); }
  else {
    Promise.all([cl.use("db"), cl.use("user"), cl.use("downloads")]).then(function (res) {
      S.db = res[0]; S.user = res[1]; S.dl = res[2];
      var u = S.user;
      var p = u ? Promise.all([u.isOwner(), u.canEdit(), u.can("data.write"), u.id ? u.id() : null]) : Promise.resolve([false, false, null, null]);
      return p.then(function (v) { S.owner = !!v[0]; S.admin = !!(v[0] || v[1]); S.canWrite = v[2] !== false; S.me = v[3] || null; start(S.db ? "db" : "local"); });
    }).catch(function () { start("local"); });
  }
})();
